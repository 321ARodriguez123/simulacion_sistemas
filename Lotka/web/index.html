<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Lotka-Volterra (Google Charts)</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="bg-green-50">

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path>
                </svg>
                <span>Portal<strong>Sim</strong></span>
            </div>
            <a href="index.html" class="nav-link">Volver al Inicio</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="view-section max-w-5xl fade-in">
            <div class="panel">
                <h2 class="panel-title">Modelo Lotka-Volterra</h2>
                <p class="panel-subtitle">Simulación de la dinámica entre Lobos (Depredadores) y Ovejas (Presas)</p>
                
                <div class="flex-layout">
                    <div class="controls-sidebar">
                        <div class="input-group">
                            <label>Ovejas iniciales (<strong id="val_ovejas0">40</strong>)</label>
                            <input type="range" id="ovejas0" min="1" max="100" step="1" value="40" class="w-full">
                        </div>
                        <div class="input-group">
                            <label>Lobos iniciales (<strong id="val_lobos0">9</strong>)</label>
                            <input type="range" id="lobos0" min="1" max="50" step="1" value="9" class="w-full">
                        </div>
                        <div class="input-grid">
                            <div class="input-group">
                                <label>Crec. Ovejas (α): <br><strong id="val_alpha" class="text-green">0.50</strong></label>
                                <input type="range" id="alpha" min="0.01" max="1.0" step="0.01" value="0.5" class="w-full">
                            </div>
                            <div class="input-group">
                                <label>Caza (β): <br><strong id="val_beta" class="text-green">0.02</strong></label>
                                <input type="range" id="beta" min="0.01" max="0.1" step="0.01" value="0.02" class="w-full">
                            </div>
                            <div class="input-group">
                                <label>Nutrición (δ): <br><strong id="val_delta" class="text-green">0.01</strong></label>
                                <input type="range" id="delta" min="0.001" max="0.1" step="0.001" value="0.01" class="w-full">
                            </div>
                            <div class="input-group">
                                <label>Muerte Lobos (γ): <br><strong id="val_gamma" class="text-green">0.30</strong></label>
                                <input type="range" id="gamma" min="0.01" max="1.0" step="0.01" value="0.3" class="w-full">
                            </div>
                        </div>
                        
                        <button onclick="iniciar()" id="btn-iniciar" class="btn btn-primary w-full mt-1" disabled>Reiniciar Simulación</button>
                        <button onclick="detener()" class="btn btn-outline w-full mt-1">Pausar</button>
                        
                        <div id="info-bar" class="hint-text mt-1 text-center">
                            Cargando gráficos...
                        </div>
                    </div>
                    
                    <div class="chart-container">
                        <div class="lv-chart-area">
                            <h3 class="chart-title">Dinámica en el tiempo</h3>
                            <div id="timeChart" class="h-full w-full"></div>
                        </div>
                        <div class="lv-chart-area mt-2">
                            <h3 class="chart-title">Espacio de fase</h3>
                            <div id="phaseChart" class="h-full w-full"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
