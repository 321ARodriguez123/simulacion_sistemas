<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Lotka-Volterra (Google Charts)</title>
    <link rel="stylesheet" href="style.css">
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>Modelo Depredador-Presa (Google Charts)</h1>
        </header>

        <div class="charts-wrapper">
            <div class="chart-card">
                <h2>Dinámica en el tiempo</h2>
                <div class="canvas-container">
                    <div id="timeChart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
            <div class="chart-card">
                <h2>Espacio de fase</h2>
                <div class="canvas-container">
                    <div id="phaseChart" style="width: 100%; height: 100%;"></div>
                </div>
            </div>
        </div>

        <div class="info-bar" id="info-bar">
            Cargando gráficos...
        </div>

        <div class="controls-panel">
            <div class="sliders-grid">
                <div class="slider-row">
                    <label>alpha: crecimiento ovejas</label>
                    <input type="range" id="alpha" min="0.01" max="1.0" step="0.01" value="0.5">
                    <span class="value-display" id="val_alpha">0.50</span>
                </div>
                <div class="slider-row">
                    <label>beta: caza de lobos</label>
                    <input type="range" id="beta" min="0.01" max="0.1" step="0.01" value="0.02">
                    <span class="value-display" id="val_beta">0.02</span>
                </div>
                <div class="slider-row">
                    <label>delta: crecimiento lobos</label>
                    <input type="range" id="delta" min="0.001" max="0.1" step="0.001" value="0.01">
                    <span class="value-display" id="val_delta">0.01</span>
                </div>
                <div class="slider-row">
                    <label>gamma: muerte lobos</label>
                    <input type="range" id="gamma" min="0.01" max="1.0" step="0.01" value="0.3">
                    <span class="value-display" id="val_gamma">0.30</span>
                </div>
                <div class="slider-row">
                    <label>Ovejas iniciales</label>
                    <input type="range" id="ovejas0" min="1" max="100" step="1" value="40">
                    <span class="value-display" id="val_ovejas0">40</span>
                </div>
                <div class="slider-row">
                    <label>Lobos iniciales</label>
                    <input type="range" id="lobos0" min="1" max="50" step="1" value="9">
                    <span class="value-display" id="val_lobos0">9</span>
                </div>
            </div>
            
            <div class="actions">
                <button class="btn-primary" onclick="iniciar()" id="btn-iniciar" disabled>Reiniciar Simulación</button>
                <button class="btn-danger" onclick="detener()">Pausar</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
