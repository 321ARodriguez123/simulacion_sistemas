<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Simuladores</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body" class="bg-green-50">

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo" onclick="showView('home')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10l-2 1m0 0l-2-1m2 1v2.5M20 7l-2 1m2-1l-2-1m2 1v2.5M14 4l-2-1-2 1M4 7l2-1M4 7l2 1M4 7v2.5M12 21l-2-1m2 1l2-1m-2 1v-2.5M6 18l-2-1v-2.5M18 18l2-1v-2.5"></path>
                </svg>
                <span>Portal<strong>Sim</strong></span>
            </div>
            <button class="nav-link" onclick="showView('home')">Inicio</button>
        </div>
    </nav>

    <main class="main-content">
        
        <div id="view-home" class="view-section fade-in active">
            <div class="hero-text">
                <h1>Bienvenido al Portal Multiusos</h1>
                <p>Selecciona una de las herramientas a continuación. Explora desde simulaciones biológicas hasta entretenimiento y utilidades matemáticas, todo en un entorno minimalista.</p>
            </div>

            <div class="card-grid">
                <button onclick="calculadora()" onmouseenter="changeBackground('bg-green-100')" onmouseleave="resetBackground()" class="card">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    </div>
                    <h2>Calculadora</h2>
                    <p>Herramienta matemática básica para cálculos rápidos del día a día.</p>
                </button>

                <button onclick="lotkaVoltera()" onmouseenter="changeBackground('bg-lime-100')" onmouseleave="resetBackground()" class="card">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                    </div>
                    <h2>Lobos y Ovejas</h2>
                    <p>Simulador del modelo Lotka-Volterra de dinámica de poblaciones.</p>
                </button>

                <button onclick="covid()" onmouseenter="changeBackground('bg-teal-100')" onmouseleave="resetBackground()" class="card">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </div>
                    <h2>Simulador Covid</h2>
                    <p>Modelo de propagación celular basado en el Juego de la Vida.</p>
                </button>

                <button onclick="casino()" onmouseenter="changeBackground('bg-emerald-100')" onmouseleave="resetBackground()" class="card">
                    <div class="card-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2>Ruleta de Casino</h2>
                    <p>Pon a prueba tu suerte con este simulador clásico de ruleta.</p>
                </button>
            </div>
        </div>
    </main>
    
    <script type="text/javascript" src="/eel.js"></script>
    <script src="script.js"></script>
</body>
</html>
